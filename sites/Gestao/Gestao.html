<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minha Gestão de Dívidas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/3.0.3/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" type="text/css" href="css/main.css">
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen">

  <div class="max-w-5xl mx-auto p-8">
    <h1 class="text-4xl font-bold text-emerald-400 mb-2 flex items-center gap-3">
      <i class="fas fa-calculator"></i> Gestão de Dívidas
    </h1>
    <p class="text-zinc-400 mb-8">Calcule tudo e baixe seu relatório em PDF</p>

    <!-- Formulário -->
    <div class="bg-zinc-900 rounded-2xl p-6 mb-8">
      <h2 class="text-xl font-semibold mb-4">Adicionar Dívida</h2>
      <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
        <input id="nome" type="text" placeholder="Nome da dívida" class="bg-zinc-800 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <input id="valor" type="number" step="0.01" placeholder="Valor (R$)" class="bg-zinc-800 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <input id="vencimento" type="date" class="bg-zinc-800 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <input id="juros" type="number" step="0.01" placeholder="Juros % ao mês" class="bg-zinc-800 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500" value="0">
        <button onclick="adicionarDivida()" class="bg-emerald-500 hover:bg-emerald-600 text-black font-bold rounded-xl px-6 flex items-center justify-center gap-2">
          <i class="fas fa-plus"></i> Adicionar
        </button>
      </div>
    </div>

    <!-- Tabela de dívidas -->
    <div class="bg-zinc-900 rounded-2xl p-6 mb-8">
      <h2 class="text-xl font-semibold mb-4">Suas Dívidas</h2>
      <table class="w-full">
        <thead>
          <tr class="text-zinc-400 text-left border-b border-zinc-700">
            <th class="pb-3">Dívida</th>
            <th class="pb-3">Valor</th>
            <th class="pb-3">Vencimento</th>
            <th class="pb-3">Juros/mês</th>
            <th class="pb-3">Valor com Juros</th>
            <th class="pb-3 text-center">Ação</th>
          </tr>
        </thead>
        <tbody id="tabela-dividas" class="text-zinc-300"></tbody>
      </table>
    </div>

    <!-- Resumo -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
      <div class="bg-zinc-900 rounded-2xl p-6 text-center">
        <p class="text-zinc-400 text-sm">Total de Dívidas</p>
        <p id="total-dividas" class="text-5xl font-bold text-emerald-400">0</p>
      </div>
      <div class="bg-zinc-900 rounded-2xl p-6 text-center">
        <p class="text-zinc-400 text-sm">Valor Total</p>
        <p id="total-valor" class="text-5xl font-bold text-white">R$ 0,00</p>
      </div>
      <div class="bg-zinc-900 rounded-2xl p-6 text-center">
        <p class="text-zinc-400 text-sm">Valor Estimado com Juros</p>
        <p id="total-com-juros" class="text-5xl font-bold text-amber-400">R$ 0,00</p>
      </div>
    </div>

    <button onclick="gerarPDF()" 
            class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold text-xl py-5 rounded-3xl flex items-center justify-center gap-3 shadow-lg shadow-emerald-500/30">
      <i class="fas fa-file-pdf"></i> GERAR E BAIXAR RELATÓRIO EM PDF
    </button>
  </div>

  <script src="js/main.js">
  </script>
</body>
</html>
